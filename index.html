<title>Форматы занятий</title>
<style>
/* Layout: white bedazzled sticker sheet — rhinestones scattered on a canvas behind one phone-width column of screens; tap anywhere to throw gems */
:root{
  --bg:#FFFFFF; --ink:#1F1520; --muted:#7C6774; --line:#F0E2E9;
  --pink:#EC3E8C; --pink-soft:#FFE4F0; --blue:#2A9FD8; --green:#1E9E78; --pearl:#F6F1F4;
  --glass:rgba(255,255,255,.86);
  --f-display:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;padding-inline:16px;padding-block:0;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#gems{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:32px 40px;pointer-events:none}
.screen{pointer-events:auto;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.card{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 18px 50px rgba(236,62,140,.10),0 2px 6px rgba(31,21,32,.05)}

h1{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,10vw,48px);line-height:1;margin:0;letter-spacing:-.03em;text-wrap:balance}
h1 em{color:var(--pink);font-style:normal}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,36px);line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance}
.lead{font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.3;color:var(--muted);margin:8px 0 0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
h3{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
p{margin:0}

/* jewel buttons */
.jewel{position:relative;display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:999px;padding:17px 22px;font:700 16px/1.2 var(--f-ui);color:#fff;text-decoration:none;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#FF6FAE 0%,var(--pink) 55%,#C81F6B 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12),0 10px 24px rgba(236,62,140,.35);transition:transform .15s}
.jewel:active{transform:scale(.97)}
.jewel::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.jewel .arrow{margin-left:auto;font-size:20px}
.jewel.white{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 8px 20px rgba(31,21,32,.06)}
.jewel.white::after{background:linear-gradient(100deg,transparent,rgba(236,62,140,.12),transparent)}
.jewel.blue{background:linear-gradient(180deg,#6FCBF5 0%,var(--blue) 55%,#1777A8 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12),0 10px 24px rgba(42,159,216,.32)}
.jewel.green{background:linear-gradient(180deg,#5FD6AE 0%,var(--green) 55%,#127557 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12),0 10px 24px rgba(30,158,120,.32)}
.gem{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 14%,rgba(255,255,255,.5) 26%,transparent 46%),conic-gradient(from 20deg,rgba(255,255,255,.6),rgba(255,255,255,.1),rgba(255,255,255,.55),rgba(255,255,255,.05),rgba(255,255,255,.6));border:1.5px solid rgba(255,255,255,.75)}
.stack{display:grid;gap:12px;margin-top:22px}
.jewel:focus-visible,.back:focus-visible,.code:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.back{pointer-events:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:700 13px var(--f-ui);color:var(--ink);margin-bottom:12px;cursor:pointer}

.fit{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.fit li{position:relative;padding-left:22px}
.fit li::before{content:"";position:absolute;left:2px;top:.55em;width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#FFB3D3,var(--pink));border-radius:2px}
.why{display:grid;gap:12px}
.why div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.why b{display:block;font-size:15px;margin-bottom:2px}
.why span{color:var(--muted);font-size:14.5px}
.callout{margin-top:18px;border-radius:18px;padding:14px 16px;background:var(--pink-soft);border:1.5px dashed var(--pink);font-size:14.5px}
.callout b{color:var(--pink)}
.note{margin-top:16px;font-weight:700;font-size:16px;line-height:1.35}
.cta{margin-top:22px;display:grid;gap:10px}
.codehint{text-align:center;font-size:13px;color:var(--muted)}
.code{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:2px 8px;font:800 13px var(--f-ui);letter-spacing:.08em;cursor:pointer;color:var(--ink)}

/* polaroids */
.gallery{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 14px;margin:0 -6px}
.pol{flex:0 0 88%;max-width:400px;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 10px 14px;box-shadow:0 10px 24px rgba(31,21,32,.10);position:relative}
.pol:nth-child(odd){transform:rotate(-1deg)} .pol:nth-child(even){transform:rotate(1deg)}
.pol .ph{aspect-ratio:2/1;cursor:zoom-in;max-width:100%;border-radius:4px;overflow:hidden;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(31,21,32,.45)}
.pol img{width:100%;height:100%;object-fit:cover;object-position:left center;display:block}
.lb{position:fixed;inset:0;z-index:10;background:rgba(255,255,255,.94);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:85vh;border-radius:8px;box-shadow:0 20px 50px rgba(31,21,32,.25)}
.lb p{font-weight:700;font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
.pol .cap{font-weight:700;font-size:15px;line-height:1.2;margin-top:10px;letter-spacing:-.01em}
.pol .pin{position:absolute;top:-9px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,transparent 40%),radial-gradient(circle,#FF8CC0,var(--pink) 60%,#B01860);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.swipe{font-size:12px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;z-index:5;pointer-events:none}
.tapnote{pointer-events:none;text-align:center;font-size:12px;color:var(--muted);margin-top:14px}

@media (prefers-reduced-motion:reduce){.screen{animation:none}.jewel::after{animation:none;display:none}}
</style>

<canvas id="gems" aria-hidden="true"></canvas>
<main id="app" aria-live="polite"></main>
<div class="toast" id="toast" hidden></div>

function go(name, burstAt){
  if(!S[name]) name='home';
  app.innerHTML = S[name]();
  if(location.hash.slice(1)!==name){ try{history.replaceState(null,'','#'+name)}catch(e){} }
  window.scrollTo({top:0});
  const f = app.querySelector('h1,h2'); if(f){f.setAttribute('tabindex','-1');f.focus({preventScroll:true})}
}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){burst(e.clientX,e.clientY,14);go(g.dataset.go);return}
  const c=e.target.closest('[data-copy]'); if(c){const t=c.dataset.copy;
    const done=()=>toast(`«${t}» скопировано`);
    try{navigator.clipboard.writeText(t).then(done,()=>toast(`Кодовое слово: ${t}`))}catch(err){toast(`Кодовое слово: ${t}`)}
    burst(e.clientX,e.clientY,10)}
  const a=e.target.closest('a.jewel'); if(a) burst(e.clientX,e.clientY,16);
  const im=e.target.closest('.pol img'); if(im){const lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-label',im.alt);
    lb.innerHTML=`<div><img src="${im.src}" alt="${im.alt}"><p>${im.alt} · тапни, чтобы закрыть</p></div>`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)}
});
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

/* ===== rhinestones ===== */
const cv=document.getElementById('gems'),cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLS=['#F2338A','#F7A1C4','#2A9FD8','#1E9E78','#A9C23A','#8E7CC3','#E5384F','#4FC3C9','#F06BA8'];
let W,H,DPR,base,flying=[],twinkles=[];
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));return`rgb(${r},${g},${b})`}
function shadow(c){c.shadowColor='rgba(31,21,32,.18)';c.shadowBlur=4;c.shadowOffsetY=2}
function round(c,r,col){shadow(c);const g=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,shade(col,90));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-60));
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=Math.max(.6,r*.06);c.beginPath();
  for(let i=0;i<8;i++){const a=i/8*6.283;c.moveTo(Math.cos(a)*r*.45,Math.sin(a)*r*.45);c.lineTo(Math.cos(a)*r*.95,Math.sin(a)*r*.95)}c.stroke();
  c.beginPath();for(let i=0;i<=8;i++){const a=i/8*6.283;c[i?'lineTo':'moveTo'](Math.cos(a)*r*.45,Math.sin(a)*r*.45)}c.stroke();
  c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.ellipse(-r*.35,-r*.4,r*.22,r*.12,-.6,0,7);c.fill()}
function pearl(c,r){shadow(c);const g=c.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.6,'#ECE6EA');g.addColorStop(1,'#B9AEB6');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowColor='transparent';c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(-r*.35,-r*.38,r*.18,0,7);c.fill()}
function heart(c,s,col){shadow(c);const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,shade(col,80));g.addColorStop(.5,col);g.addColorStop(1,shade(col,-70));
  c.fillStyle=g;c.beginPath();c.moveTo(0,s*.85);c.bezierCurveTo(-s*1.3,0,-s*.7,-s*1.05,0,-s*.4);c.bezierCurveTo(s*.7,-s*1.05,s*1.3,0,0,s*.85);c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=1;c.beginPath();c.moveTo(0,-s*.4);c.lineTo(0,s*.85);c.moveTo(-s*.55,-s*.3);c.lineTo(0,s*.2);c.lineTo(s*.55,-s*.3);c.stroke();
  c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(-s*.45,-s*.45,s*.18,s*.09,-.7,0,7);c.fill()}
function emerald(c,s,col){shadow(c);const w=s*1.5,h=s;const g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,shade(col,80));g.addColorStop(1,shade(col,-50));
  c.fillStyle=g;c.beginPath();c.roundRect?c.roundRect(-w/2,-h/2,w,h,s*.18):c.rect(-w/2,-h/2,w,h);c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1;c.strokeRect(-w*.3,-h*.25,w*.6,h*.5);c.fillStyle='rgba(255,255,255,.35)';c.fillRect(-w*.3,-h*.25,w*.6,h*.18)}
function sparkle(c,s,col){const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#fff');g.addColorStop(.5,col||'#C9C3CC');g.addColorStop(1,'#8A8290');
  c.fillStyle=g;c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*.12,-s*.12,s,0);c.quadraticCurveTo(s*.12,s*.12,0,s);c.quadraticCurveTo(-s*.12,s*.12,-s,0);c.quadraticCurveTo(-s*.12,-s*.12,0,-s);c.fill()}
function star(c,s,col){shadow(c);const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,shade(col,80));g.addColorStop(1,shade(col,-50));c.fillStyle=g;c.beginPath();
  for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=i/10*6.283-1.571;c[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=1;c.beginPath();for(let i=0;i<5;i++){const a=i/5*6.283-1.571;c.moveTo(0,0);c.lineTo(Math.cos(a)*s,Math.sin(a)*s)}c.stroke()}
function drawGem(c,g){c.save();c.translate(g.x,g.y);c.rotate(g.a);c.globalAlpha=g.o??1;
  ({round:()=>round(c,g.s,g.col),pearl:()=>pearl(c,g.s),heart:()=>heart(c,g.s,g.col),emerald:()=>emerald(c,g.s,g.col),sparkle:()=>sparkle(c,g.s*1.2),star:()=>star(c,g.s,g.col)})[g.k]();c.restore()}
const KINDS=['round','round','round','pearl','pearl','heart','heart','emerald','sparkle','sparkle','star'];
function mkGem(r,x,y,scale=1){const k=KINDS[r()*KINDS.length|0];return{k,x,y,a:(r()-.5)*1.2,s:(k==='pearl'?6+r()*9:k==='sparkle'?7+r()*6:7+r()*11)*scale,col:COLS[r()*COLS.length|0]}}
function layout(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  base=document.createElement('canvas');base.width=W*DPR;base.height=H*DPR;const b=base.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);
  const r=rnd(7),n=Math.round(W*H/9500),gems=[];
  for(let i=0;i<n;i++){let x,y,t=0;do{x=r()*W;y=r()*H;t++}while(t<8&&gems.some(g=>Math.hypot(g.x-x,g.y-y)<46));gems.push(mkGem(r,x,y))}
  gems.forEach(g=>drawGem(b,g));
  twinkles=gems.filter((g,i)=>i%4===0).map(g=>({x:g.x+g.s*.4,y:g.y-g.s*.5,ph:Math.random()*6.28}));
  frame(0)}
function frame(t){cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);cx.drawImage(base,0,0,W,H);
  if(!reduce){twinkles.forEach(k=>{const v=Math.max(0,Math.sin(t/650+k.ph));if(v>.05){cx.save();cx.translate(k.x,k.y);cx.globalAlpha=v;cx.scale(v,v);sparkle(cx,7,'#FFFFFF');cx.restore()}})}
  flying=flying.filter(g=>g.y<H+40&&g.life>0);
  flying.forEach(g=>{g.vy+=.32;g.x+=g.vx;g.y+=g.vy;g.a+=g.va;g.life-=.006;g.o=Math.min(1,g.life*2);drawGem(cx,g)})}
function loop(t){frame(t);requestAnimationFrame(loop)}
function burst(x,y,n=12){if(reduce||x==null)return;const r=Math.random;
  for(let i=0;i<n;i++){const g=mkGem(r,x,y,.9);const a=r()*6.283,sp=3+r()*6;Object.assign(g,{vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-5,va:(r()-.5)*.3,life:1});flying.push(g)}}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,a,.gallery'))burst(e.clientX,e.clientY,12)});
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(layout,150)});
layout();if(!reduce)requestAnimationFrame(loop);

addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==app.dataset.cur)go(h)});
go(location.hash.slice(1)||'home');
</script>
